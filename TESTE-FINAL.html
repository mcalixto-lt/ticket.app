<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste Final - Ticket. Atualização</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 10px;
    }
    .version {
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
      color: #6f46c4;
      margin: 20px 0;
    }
    .info {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      margin: 20px 0;
      text-align: center;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      margin: 10px 0;
      transition: all 0.3s ease;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }
    .status.checking { background: #e2e3e5; color: #383d41; display: block; }
    .status.success { background: #d4edda; color: #155724; display: block; }
    .status.error { background: #f8d7da; color: #721c24; display: block; }
    .status.warning { background: #fff3cd; color: #856404; display: block; }
    pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 10px;
      overflow-x: auto;
      font-size: 12px;
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Teste de Atualização</h1>
    <div class="version" id="appVersion">1.0.31</div>
    
    <div class="info">
      <p>Versão no repositório: <strong>1.0.32</strong></p>
      <p style="margin-top: 8px; font-size: 14px; color: #666;">
        Clique no botão para testar o sistema de atualização
      </p>
    </div>
    
    <button id="checkBtn" onclick="checkUpdates()">
      🔍 Procurar atualizações
    </button>
    
    <div id="status" class="status"></div>
    <pre id="log"></pre>
  </div>

  <script>
    const APP_VERSION = '1.0.31';
    document.getElementById('appVersion').textContent = APP_VERSION;
    
    let log = [];
    
    function addLog(message) {
      const timestamp = new Date().toLocaleTimeString('pt-BR');
      log.push(`[${timestamp}] ${message}`);
      document.getElementById('log').textContent = log.join('\n');
      console.log(message);
    }
    
    function setStatus(message, type) {
      const status = document.getElementById('status');
      status.innerHTML = message;
      status.className = `status ${type}`;
    }
    
    async function checkUpdates() {
      const btn = document.getElementById('checkBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Procurando...';
      
      addLog('=== INICIANDO VERIFICAÇÃO ===');
      addLog(`Versão instalada: ${APP_VERSION}`);
      
      try {
        // Tentar 3 fontes
        const sources = [
          { name: 'jsDelivr', url: `https://cdn.jsdelivr.net/gh/mcalixto-lt/ticket.app@main/public/version.json?t=${Date.now()}` },
          { name: 'GitHub Raw', url: `https://raw.githubusercontent.com/mcalixto-lt/ticket.app/main/public/version.json?t=${Date.now()}` },
          { name: 'GitHub API', url: `https://api.github.com/repos/mcalixto-lt/ticket.app/contents/public/version.json?ref=main?t=${Date.now()}` }
        ];
        
        let latest = null;
        let usedSource = null;
        
        for (const source of sources) {
          addLog(`Testando: ${source.name}`);
          
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);
            
            const response = await fetch(source.url, {
              method: 'GET',
              cache: 'no-store',
              credentials: 'omit',
              headers: { 'Accept': 'application/json' },
              signal: controller.signal
            });
            
            clearTimeout(timeoutId);
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const text = await response.text();
            
            if (text.includes('<!doctype') || text.includes('<html')) {
              throw new Error('Retornou HTML');
            }
            
            let data;
            if (source.name === 'GitHub API') {
              const api = JSON.parse(text);
              if (!api?.content) throw new Error('Sem conteúdo');
              const decoded = atob(api.content.replace(/\s/g, ''));
              data = JSON.parse(decoded);
            } else {
              data = JSON.parse(text);
            }
            
            latest = data.version;
            usedSource = source.name;
            addLog(`✓ Versão encontrada: ${latest} (via ${source.name})`);
            break;
            
          } catch (error) {
            addLog(`✗ Falhou: ${error.message}`);
          }
        }
        
        if (!latest) {
          throw new Error('Todas as fontes falharam');
        }
        
        // Comparar versões
        const av = APP_VERSION.split('.').map(Number);
        const bv = latest.split('.').map(Number);
        let comparison = 0;
        for (let i = 0; i < 3; i++) {
          if (bv[i] > av[i]) { comparison = 1; break; }
          if (bv[i] < av[i]) { comparison = -1; break; }
        }
        
        addLog(`Comparação: ${latest} vs ${APP_VERSION} = ${comparison > 0 ? 'NOVA' : comparison === 0 ? 'IGUAL' : 'ANTIGA'}`);
        
        if (comparison > 0) {
          setStatus(`
            <strong>✅ NOVA VERSÃO DISPONÍVEL!</strong><br>
            De: ${APP_VERSION}<br>
            Para: ${latest}<br>
            <small>Encontrada às ${new Date().toLocaleTimeString('pt-BR')} via ${usedSource}</small>
          `, 'success');
          
          addLog('✅ ATUALIZAÇÃO DISPONÍVEL!');
          
        } else if (comparison === 0) {
          setStatus(`
            <strong>✓ Sistema Atualizado</strong><br>
            Você está na versão mais recente: Ticket. ${APP_VERSION}<br>
            <small>Verificado às ${new Date().toLocaleTimeString('pt-BR')}</small>
          `, 'success');
          
          addLog('✓ SISTEMA ATUALIZADO');
          
        } else {
          setStatus(`
            <strong>⚠ Versão Mais Antiga</strong><br>
            Versão publicada (${latest}) é mais antiga que a instalada (${APP_VERSION})<br>
            <small>Use a versão local</small>
          `, 'warning');
          
          addLog('⚠ VERSÃO MAIS ANTIGA NO REPOSITÓRIO');
        }
        
      } catch (error) {
        addLog(`❌ ERRO: ${error.message}`);
        setStatus(`
          <strong>✗ Erro na Verificação</strong><br>
          <small>${error.message}</small><br>
          <small>Tente novamente às ${new Date().toLocaleTimeString('pt-BR')}</small>
        `, 'error');
      }
      
      btn.disabled = false;
      btn.textContent = '🔍 Procurar atualizações';
      addLog('=== VERIFICAÇÃO CONCLUÍDA ===');
    }
    
    // Auto-teste ao carregar
    window.addEventListener('load', () => {
      addLog('Teste de atualização carregado');
      addLog('Clique no botão para testar');
    });
  </script>
</body>
</html>
