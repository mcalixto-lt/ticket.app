<body>
  <div id="ticketBootSplash" class="ticket-boot-splash" aria-hidden="true">
    <div class="ticket-boot-tile">
      <svg class="ticket-boot-logo" viewBox="0 0 128 128" aria-hidden="true" shape-rendering="geometricPrecision">
        <defs>
          <linearGradient id="bootTicketGradient" x1="24" y1="20" x2="106" y2="109" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#835fff" />
            <stop offset="1" stop-color="#4c24a8" />
          </linearGradient>
        </defs>
        <g class="ticket-boot-spin" fill="none" stroke="url(#bootTicketGradient)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M44 44a36 36 0 1 1-8 42" />
          <path d="M35 44h28v28" />
          <path d="m37 46 24 24" />
        </g>
      </svg>
    </div>
  </div>
  <script>
    (()=>{
      const splash=document.getElementById('ticketBootSplash');
      const spinner=splash?.querySelector('.ticket-boot-spin');
      if(!splash||!spinner)return;
      let closed=false;
      const close=()=>{
        if(closed)return;closed=true;
        splash.classList.add('is-leaving');
        setTimeout(()=>splash.remove(),240);
      };
      spinner.addEventListener('animationend',close,{once:true});
      requestAnimationFrame(()=>splash.classList.add('run'));
      setTimeout(close,2300);
    })();
  </script>
