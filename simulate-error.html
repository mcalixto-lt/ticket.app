<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simular Erro de Atualização</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 { color: #333; margin-top: 0; }
    .version-info {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
    }
    .version-number {
      font-size: 1.5rem;
      font-weight: bold;
      color: #6f46c4;
    }
    button {
      background: #6f46c4;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    button:hover { background: #5a36a8; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }
    .status.checking { background: #f0e6ff; color: #6f46c4; }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.warning { background: #fff3cd; color: #856404; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🧪 Simular Sistema de Atualização</h2>
    
    <div class="version-info">
      <div>Versão instalada:</div>
      <div class="version-number" id="appVersion">1.0.31</div>
      <div style="margin-top: 10px; font-size: 14px; color: #666;">
        Clique no botão abaixo para simular o clique em "Procurar atualizações"
      </div>
    </div>
    
    <button id="checkBtn" onclick="simulateCheck()">
      🔍 Procurar atualizações
    </button>
    
    <div id="status" class="status" style="display: none;"></div>
    
    <div style="margin-top: 30px; padding: 15px; background: #e9ecef; border-radius: 8px;">
      <h3>📋 Configuração do Teste</h3>
      <p>Versão no repositório: <strong>1.0.32</strong></p>
      <p>Versão instalada: <strong>1.0.31</strong></p>
      <p>Resultado esperado: <strong>NOVA VERSÃO DISPONÍVEL</strong></p>
    </div>
  </div>

  <script>
    const APP_VERSION = '1.0.31'; // Versão mais antiga para testar
    
    document.getElementById('appVersion').textContent = APP_VERSION;
    
    async function simulateCheck() {
      const btn = document.getElementById('checkBtn');
      const status = document.getElementById('status');
      
      // Desabilitar botão
      btn.disabled = true;
      btn.innerHTML = '⏳ Procurando...';
      
      // Mostrar status
      status.style.display = 'block';
      status.className = 'status checking';
      status.textContent = 'Procurando atualizações disponíveis...';
      
      try {
        // Testar fetch
        const response = await fetch('https://raw.githubusercontent.com/mcalixto-lt/ticket.app/main/public/version.json?t=' + Date.now(), {
          cache: 'no-store'
        });
        
        const text = await response.text();
        const data = JSON.parse(text);
        const latest = data.version;
        
        // Comparar versões
        const av = APP_VERSION.split('.').map(Number);
        const bv = latest.split('.').map(Number);
        let comparison = 0;
        for (let i = 0; i < 3; i++) {
          if (bv[i] > av[i]) { comparison = 1; break; }
          if (bv[i] < av[i]) { comparison = -1; break; }
        }
        
        if (comparison > 0) {
          status.className = 'status success';
          status.innerHTML = `<strong>✅ NOVA VERSÃO DISPONÍVEL!</strong><br>
            De: ${APP_VERSION}<br>
            Para: ${latest}<br>
            <small>Atualização encontrada às ${new Date().toLocaleTimeString('pt-BR')}</small>`;
        } else if (comparison === 0) {
          status.className = 'status success';
          status.textContent = `✓ Sistema atualizado. Você está na versão mais recente: Ticket. ${APP_VERSION} · verificado às ${new Date().toLocaleTimeString('pt-BR')}.`;
        } else {
          status.className = 'status warning';
          status.textContent = `⚠ Versão publicada (${latest}) é mais antiga que a instalada (${APP_VERSION}). Use a versão local.`;
        }
        
      } catch (error) {
        status.className = 'status error';
        status.innerHTML = `✗ Não foi possível verificar atualizações.<br>
          <small>${error.message}</small><br>
          <small>Tente novamente às ${new Date().toLocaleTimeString('pt-BR')}.</small>`;
      }
      
      // Reabilitar botão
      btn.disabled = false;
      btn.innerHTML = '🔍 Procurar atualizações';
    }
  </script>
</body>
</html>
