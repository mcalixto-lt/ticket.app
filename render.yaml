services:
  - type: web
    name: ticket-app
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: "echo Ticket.app 1.0.8 - static site"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: ticket-app-ai
    runtime: node
    branch: main
    rootDir: server
    autoDeployTrigger: commit
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
