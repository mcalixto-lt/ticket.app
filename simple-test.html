<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste Simples de Atualização</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
    .test h3 { margin-top: 0; }
    button { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
    button:hover { background: #5a67d8; }
    button:disabled { background: #ccc; }
    pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
    .success { color: green; font-weight: bold; }
    .error { color: red; font-weight: bold; }
    .warning { color: orange; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🧪 Teste Simples de Atualização - Ticket.</h1>
  
  <div class="test">
    <h3>Teste 1: Verificar versão do app</h3>
    <p>Versão no código: <strong id="appVer">-</strong></p>
  </div>
  
  <div class="test">
    <h3>Teste 2: Fetch do version.json</h3>
    <button onclick="testVersionFetch()">Testar Fetch</button>
    <button onclick="testAllSources()">Testar Todas as Fontes</button>
    <pre id="fetchResult">Clique nos botões para testar...</pre>
  </div>
  
  <div class="test">
    <h3>Teste 3: Simular clique no botão</h3>
    <button onclick="simulateButtonClick()">Simular Clique no Botão</button>
    <pre id="buttonResult">Nenhum teste realizado ainda...</pre>
  </div>
  
  <div class="test">
    <h3>Teste 4: Verificar Service Worker</h3>
    <button onclick="checkSW()">Verificar SW</button>
    <pre id="swResult">-</pre>
  </div>

  <script>
    const APP_VERSION = '1.0.32'; // Versão do código
    document.getElementById('appVer').textContent = APP_VERSION;
    
    async function testVersionFetch() {
      const result = document.getElementById('fetchResult');
      result.textContent = 'Testando...';
      
      try {
        const url = 'https://raw.githubusercontent.com/mcalixto-lt/ticket.app/main/public/version.json?t=' + Date.now();
        result.textContent = `URL: ${url}\n`;
        
        const response = await fetch(url, {
          method: 'GET',
          cache: 'no-store',
          credentials: 'omit',
          headers: { 'Accept': 'application/json' }
        });
        
        result.textContent += `Status: ${response.status} ${response.statusText}\n`;
        result.textContent += `Content-Type: ${response.headers.get('content-type')}\n\n`;
        
        const text = await response.text();
        result.textContent += `Resposta:\n${text}\n`;
        
        const data = JSON.parse(text);
        result.textContent += `\nVersão encontrada: ${data.version}`;
        result.textContent += `\n\n✅ TESTE PASSOU!`;
        result.className = 'success';
      } catch (error) {
        result.textContent = `❌ ERRO: ${error.message}\n\n${error.stack}`;
        result.className = 'error';
      }
    }
    
    async function testAllSources() {
      const result = document.getElementById('fetchResult');
      result.textContent = 'Testando todas as fontes...\n\n';
      
      const sources = [
        { label: 'jsDelivr', url: `https://cdn.jsdelivr.net/gh/mcalixto-lt/ticket.app@main/public/version.json?t=${Date.now()}` },
        { label: 'GitHub Raw', url: `https://raw.githubusercontent.com/mcalixto-lt/ticket.app/main/public/version.json?t=${Date.now()}` },
        { label: 'GitHub API', url: `https://api.github.com/repos/mcalixto-lt/ticket.app/contents/public/version.json?ref=main&t=${Date.now()}` }
      ];
      
      for (const source of sources) {
        result.textContent += `Testando: ${source.label}\n`;
        result.textContent += `URL: ${source.url}\n`;
        
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 5000);
          
          const response = await fetch(source.url, {
            method: 'GET',
            cache: 'no-store',
            credentials: 'omit',
            headers: { 'Accept': 'application/json' },
            signal: controller.signal
          });
          
          clearTimeout(timeoutId);
          
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          
          const text = await response.text();
          
          if (text.includes('<!doctype') || text.includes('<html')) {
            throw new Error('Resposta é HTML, não JSON');
          }
          
          let data;
          if (source.label === 'GitHub API') {
            const api = JSON.parse(text);
            if (!api?.content) throw new Error('Sem conteúdo');
            const decoded = atob(api.content.replace(/\s/g, ''));
            data = JSON.parse(decoded);
          } else {
            data = JSON.parse(text);
          }
          
          result.textContent += `✅ Versão: ${data.version}\n\n`;
        } catch (error) {
          result.textContent += `❌ Erro: ${error.message}\n\n`;
        }
      }
    }
    
    function simulateButtonClick() {
      const result = document.getElementById('buttonResult');
      result.textContent = 'Simulando clique no botão "Procurar atualizações"...\n\n';
      
      // Simular o que o botão faz
      result.textContent += '1. Verificando se checking=false... ✓\n';
      result.textContent += '2. Desabilitando botão... ✓\n';
      result.textContent += '3. Atualizando status para "Procurando..."... ✓\n';
      result.textContent += '4. Chamando fetchPublishedVersion()...\n';
      
      setTimeout(async () => {
        try {
          const response = await fetch('https://raw.githubusercontent.com/mcalixto-lt/ticket.app/main/public/version.json?t=' + Date.now(), {
            cache: 'no-store'
          });
          const text = await response.text();
          const data = JSON.parse(text);
          
          result.textContent += `5. Versão encontrada: ${data.version} ✓\n`;
          result.textContent += `6. Comparando com APP_VERSION (${APP_VERSION})...\n`;
          
          const av = APP_VERSION.split('.').map(Number);
          const bv = data.version.split('.').map(Number);
          let comparison = 0;
          for (let i = 0; i < 3; i++) {
            if (bv[i] > av[i]) { comparison = 1; break; }
            if (bv[i] < av[i]) { comparison = -1; break; }
          }
          
          result.textContent += `7. Resultado: ${comparison > 0 ? 'NOVA VERSÃO!' : comparison === 0 ? 'MESMA VERSÃO' : 'VERSÃO MAIS ANTIGA'}\n`;
          
          if (comparison > 0) {
            result.textContent += `\n✅ ATUALIZAÇÃO DISPONÍVEL!\n`;
            result.textContent += `De: ${APP_VERSION}\n`;
            result.textContent += `Para: ${data.version}\n`;
          } else if (comparison === 0) {
            result.textContent += `\n✓ SISTEMA ATUALIZADO!\n`;
            result.textContent += `Você está na versão mais recente: ${APP_VERSION}\n`;
          } else {
            result.textContent += `\n⚠ VERSÃO MAIS ANTIGA NO REPOSITÓRIO\n`;
          }
          
          result.className = comparison > 0 ? 'success' : comparison === 0 ? 'success' : 'warning';
        } catch (error) {
          result.textContent += `❌ ERRO: ${error.message}\n`;
          result.className = 'error';
        }
      }, 1000);
    }
    
    async function checkSW() {
      const result = document.getElementById('swResult');
      
      if (!('serviceWorker' in navigator)) {
        result.textContent = '❌ Service Worker NÃO suportado pelo navegador';
        return;
      }
      
      try {
        const registration = await navigator.serviceWorker.getRegistration();
        if (registration) {
          result.textContent = `✅ Service Worker registrado!\n`;
          result.textContent += `Scope: ${registration.scope}\n`;
          result.textContent += `Estado: ${registration.installing ? 'Instalando' : registration.waiting ? 'Aguardando' : 'Ativo'}\n`;
          
          if (registration.installing) {
            result.textContent += `\n⚠️ SW está instalando. Aguarde...`;
          }
        } else {
          result.textContent = '⚠️ Service Worker NÃO registrado';
        }
      } catch (error) {
        result.textContent = `❌ Erro ao verificar SW: ${error.message}`;
      }
    }
    
    // Auto-teste ao carregar
    window.addEventListener('load', () => {
      setTimeout(() => {
        checkSW().then(() => {
          document.getElementById('swResult').textContent += '\n\n✅ Verificação concluída!';
        });
      }, 500);
    });
  </script>
</body>
</html>
